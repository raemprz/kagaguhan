<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../images/tablogo.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <script src="../js/theme.js"></script>
    <title>Login - VenPCS</title>
</head>
<body>

    <div class="navigation">
        <button onclick="window.location.href='../main/index.html'"><b>Home</b></button>
        <button onclick="window.location.href='../main/products.html'"><b>IT Products</b></button>
        <button onclick="window.location.href='../main/about.html'"><b>About</b></button>
        <button onclick="alert('Error 69: Orders functionality is currently unavailable.')"><b>Orders</b></button>
        <button onclick="window.location.href='../user/feedback.html'"><b>Feedback</b></button>
        <button class="active-page" onclick="window.location.href='login.html'"><b>Login/Signup</b></button>
        <button id="themeToggle">🌙 Dark</button>
    </div>

    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ&list=RDdQw4w9WgXcQ&start_radio=1">
        <img id="wc" src="../images/venpcslogonew.png" alt="VenPCS Logo">
    </a>

    <div class="auth-page-content">
        <div class="auth-card">
            <h1>LOGIN</h1>

            <div class="input-wrapper">
                <input type="text" id="username" placeholder="Username">
                <span>👤</span>
            </div>

            <div class="input-wrapper">
                <input type="password" id="password" placeholder="Password">
                <span>🔒</span>
            </div>

            <p id="showpass">Show Password</p>

            <p id="errormessage"></p>

            <button class="auth-btn" id="signinbtn" type="button">LOGIN</button>

            <p class="bottom-text">Don't have an account? <a href="reg.html">Register now</a></p>
        </div>
    </div>

    <script>
        const correctAdminName = "Raeven";
        const correctAdminPassword = "Admin23";

        const showpass = document.getElementById("showpass");
        const passfield = document.getElementById("password");
        const signinbtn = document.getElementById("signinbtn");
        const errormessage = document.getElementById("errormessage");

        showpass.addEventListener("click", () => {
            if (passfield.type === "text") {
                passfield.type = "password";
                showpass.innerHTML = "Show Password";
            } else {
                passfield.type = "text";
                showpass.innerHTML = "Hide Password";
            }
        });

        signinbtn.addEventListener("click", () => {
            const usernameInput = document.getElementById("username").value.trim();
            const passwordInput = document.getElementById("password").value.trim();
            const users = JSON.parse(localStorage.getItem("users")) || [];

            if (usernameInput === correctAdminName && passwordInput === correctAdminPassword) {
                alert('Successful Login! Welcome Administrator Raeven!');
                localStorage.setItem("loggedInUser", correctAdminName);
                window.location.href = "../main/index.html";
                return;
            }

            const foundUser = users.find(u => u.username === usernameInput && u.password === passwordInput);

            if (foundUser) {
                alert("Login successful! Welcome " + foundUser.username);
                localStorage.setItem("loggedInUser", foundUser.username);
                let loggedUsers = JSON.parse(localStorage.getItem("loggedUsers")) || [];
                if (!loggedUsers.includes(foundUser.username)) loggedUsers.push(foundUser.username);
                localStorage.setItem("loggedUsers", JSON.stringify(loggedUsers));
                window.location.href = "../main/index.html";
            } else {
                errormessage.innerText = "Invalid username or password.";
                errormessage.style.color = "red";
            }
        });
    </script>

</body>
</html>
